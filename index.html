<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Space Colonization — Voronoi Growth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>

  <!-- Load order -->
  <script defer src="js/config.js"></script>
  <script defer src="js/camera.js"></script>
  <script defer src="js/growth.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/sketch.js"></script>
</head>
<body>
  <div id="ui" class="glass movable">
    <div class="titlebar" id="uiTitle">🌿 FICSIT 🌿</div><div class="content">
      
      <div class="group">
        <div class="group-header">
          <span>Seeds</span>
        </div>
        <label>Seed count</label>
        <input id="seedCount" type="number" min="1" max="128" step="1" value="8" />
      
        <label>Seed radius (m)</label>
        <input id="seedRadiusM" type="number" min="1" step="1" value="2000" />
      
        <label>Seed rotation (°)</label>
        <input id="seedRotation" type="number" step="1" value="0" />
      </div>
      <!-- Center -->
      <div class="group">
        <div class="group-header">
          <span>Origin</span>
        </div>
        <label class="inline">
          <input type="radio" name="originMode" value="game" checked />
          Game 0,0
        </label>
        <label class="inline">
          <input type="radio" name="originMode" value="world" />
          World center
        </label>
      </div>
      
      <!-- Filters -->
      <div class="group">
        <div class="group-header">
          <span>Seed Targets</span>
          <div class="group-actions">
            <button id="seedsAnyBtn" class="mini">All = Any</button>
          </div>
        </div>
        <div id="seedTargetsContainer" class="seed-targets"></div>
      </div>
      
      <div class="counts">Nodes loaded: <span id="nodesCount">0</span></div>      
    
      <!-- Growth parameters in METERS -->
      <div class="group">
        <div class="group-header"><span>Growth (meters)</span></div>
        <div><label>Min distance (m)</label></div>
        <input id="minDistM" type="number" min="1" step="1" value="101" />
        <div><label>Max distance (m)</label></div>
        <input id="maxDistM" type="number" min="1" step="100" value="2001" />
        <div><label>Branch length (m)</label></div>
        <input id="branchLenM" type="number" min="1" step="1" value="56" />
      </div>
    
      <button id="resetBtn">Reset</button>
      <button id="startBtn">Start Growth</button>
    </div>
  </div>

  <div id="hint" class="glass">🖱️ Drag = Pan  Wheel = Zoom  Ctrl+Double-click = Fit</div>
</body>
</html>
